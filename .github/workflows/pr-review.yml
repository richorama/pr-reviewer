name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # IMPORTANT: Set Copilot authentication
      # You need a GitHub account with Copilot access
      # Add COPILOT_TOKEN as a repository secret with a PAT that has Copilot access
      - name: Setup Copilot Authentication
        run: |
          if [ -z "${{ secrets.COPILOT_TOKEN }}" ]; then
            echo "❌ ERROR: COPILOT_TOKEN secret is not set!"
            echo ""
            echo "To fix this:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: COPILOT_TOKEN"
            echo "4. Value: A Personal Access Token with 'copilot' scope"
            echo ""
            echo "See README.md for detailed instructions."
            exit 1
          fi
          
          echo "✅ COPILOT_TOKEN is configured"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Copilot CLI globally
        run: |
          npm install -g @github/copilot
          echo "Verifying copilot CLI installation..."
          which copilot || echo "copilot not in PATH"
          copilot --version || echo "copilot --version failed"
          
          echo ""
          echo "Available copilot commands:"
          copilot --help || true

      - name: Authenticate with GitHub CLI
        run: |
          echo "Authenticating gh CLI with the Copilot token..."
          # Unset GH_TOKEN temporarily so gh auth login can store credentials
          unset GH_TOKEN
          echo "${{ secrets.COPILOT_TOKEN }}" | gh auth login --with-token
          gh auth status
          
          echo ""
          echo "Checking Copilot extension..."
          gh extension install github/gh-copilot 2>/dev/null || true
          gh copilot --version || echo "gh copilot not available"

      - name: Try Copilot CLI auth
        run: |
          echo "=== Copilot CLI help ==="
          copilot --help 2>&1 || true
          
          echo ""
          echo "=== Checking for auth subcommand ==="
          copilot auth --help 2>&1 || echo "No auth subcommand available"
          
          echo ""
          echo "=== Trying copilot auth login ==="
          # The copilot CLI might support auth login
          echo "${{ secrets.COPILOT_TOKEN }}" | copilot auth login 2>&1 || echo "copilot auth login failed or not available"
          
          echo ""
          echo "=== Trying copilot auth status ==="
          copilot auth status 2>&1 || echo "No auth status command"
          
          echo ""
          echo "=== Testing SDK getAuthStatus with debug ==="
          # Create a simple test script
          cat > /tmp/test-auth.mjs << 'EOF'
          import { CopilotClient } from "@github/copilot-sdk";
          
          const client = new CopilotClient({ logLevel: "info" });
          
          try {
            console.log("Starting client...");
            await client.start();
            console.log("Client started");
            
            console.log("Getting auth status...");
            const status = await client.getAuthStatus();
            console.log("Auth status:", JSON.stringify(status, null, 2));
            
            if (status.isAuthenticated) {
              console.log("Listing models...");
              const models = await client.listModels();
              console.log("Models:", models.map(m => m.id || m.name));
            }
            
            await client.stop();
          } catch (e) {
            console.error("Error:", e.message);
            await client.forceStop?.() || client.stop?.();
          }
          EOF
          
          node /tmp/test-auth.mjs
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          NODE_PATH: /home/runner/work/pr-reviewer/pr-reviewer/node_modules

      - name: Run AI Code Review
        run: |
          node dist/index.js review \
            --platform github \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --owner ${{ github.repository_owner }} \
            --repository ${{ github.event.repository.name }} \
            --pr-id ${{ github.event.pull_request.number }} \
            --post-comment \
            --output review-report.md
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-report
          path: review-report.md
