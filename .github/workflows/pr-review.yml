name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install GitHub CLI and Copilot extension
        run: |
          # GitHub CLI is pre-installed on GitHub Actions runners
          # Just install the Copilot extension
          gh extension install github/gh-copilot || true
          gh copilot --version || echo "Copilot extension installed"
          
      # IMPORTANT: Authenticate GitHub CLI for Copilot
      # You need a GitHub account with Copilot access
      # Add COPILOT_TOKEN as a repository secret with a PAT that has Copilot access
      - name: Authenticate GitHub CLI for Copilot
        run: |
          if [ -z "${{ secrets.COPILOT_TOKEN }}" ]; then
            echo "❌ ERROR: COPILOT_TOKEN secret is not set!"
            echo ""
            echo "To fix this:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: COPILOT_TOKEN"
            echo "4. Value: A Personal Access Token from a GitHub account with Copilot access"
            echo ""
            echo "See README.md for detailed instructions."
            exit 1
          fi
          
          echo "${{ secrets.COPILOT_TOKEN }}" | gh auth login --with-token
          gh auth status
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Run AI Code Review
        run: |
          node dist/index.js review \
            --platform github \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --owner ${{ github.repository_owner }} \
            --repository ${{ github.event.repository.name }} \
            --pr-id ${{ github.event.pull_request.number }} \
            --post-comment \
            --output review-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-report
          path: review-report.md
