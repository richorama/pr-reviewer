name: Azure DevOps PR Review

# Run on pull requests to main and develop
pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '18.x'

steps:
  # For testing in-repo approach - users would install the extension from marketplace
  
  - task: NodeTool@0
    inputs:
      versionSpec: $(NODE_VERSION)
    displayName: 'Install Node.js $(NODE_VERSION)'

  - script: |
      npm ci
      npm run build
    displayName: 'Build PR Reviewer'

  - script: |
      node dist/azure-pipelines-task.js
    displayName: 'Run AI Code Review'
    env:
      INPUT_COPILOTTOKEN: $(COPILOT_TOKEN)
      INPUT_POSTCOMMENT: true
      INPUT_FAILONERROR: true
      
      # Don't fail the build for warnings, only for errors
      if [ $REVIEW_EXIT_CODE -eq 1 ]; then
        echo "##vso[task.logissue type=error]Code review found critical issues"
        exit 1
      fi
      
      exit 0
    displayName: 'Run AI Code Review'
    condition: succeeded()
    env:
      COPILOT_TOKEN: $(COPILOT_TOKEN)
      GH_TOKEN: $(COPILOT_TOKEN)
      REVIEW_CONFIG_PATH: '$(Build.SourcesDirectory)/review-config.json'

  # Publish the review report as a build artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/review-report.md'
      ArtifactName: 'code-review-report'
      publishLocation: 'Container'
    displayName: 'Publish Review Report'
    condition: and(succeeded(), ne(variables['PR_ID'], ''))
