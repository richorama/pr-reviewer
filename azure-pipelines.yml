name: Azure DevOps PR Review

# Run on pushes to feature branches (for testing)
trigger:
  branches:
    include:
      - feature/*

# Run on pull requests to main and develop
pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '18.x'

steps:
  # Install Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: $(NODE_VERSION)
    displayName: 'Install Node.js $(NODE_VERSION)'

  # Setup Copilot Authentication
  - script: |
      echo "Setting up Copilot authentication..."
      if [ -z "$COPILOT_TOKEN" ]; then
        echo "##vso[task.logissue type=warning]COPILOT_TOKEN is not set - add it as a pipeline variable"
      else
        echo "✅ COPILOT_TOKEN environment variable configured"
      fi
    displayName: 'Setup Copilot Authentication'
    env:
      COPILOT_TOKEN: $(COPILOT_TOKEN)

  # Install dependencies and build the tool
  - script: |
      echo "Installing dependencies and building..."
      npm ci
      npm run build
    displayName: 'Build PR Reviewer Tool'

  # Get PR ID - use Azure DevOps REST API if not in PR context
  - script: |
      echo "Build Reason: $(Build.Reason)"
      echo "Source Branch: $(Build.SourceBranch)"
      
      if [ "$(Build.Reason)" == "PullRequest" ]; then
        echo "Running in PR context, PR ID: $(System.PullRequest.PullRequestId)"
        echo "##vso[task.setvariable variable=PR_ID]$(System.PullRequest.PullRequestId)"
      else
        echo "Not running in PR context - attempting to find PR for this branch..."
        # Try to find an open PR for this branch using Azure DevOps API
        BRANCH_NAME=$(echo "$(Build.SourceBranch)" | sed 's|refs/heads/||')
        echo "Looking for PR with source branch: $BRANCH_NAME"
        
        PR_RESPONSE=$(curl -s -u ":$(System.AccessToken)" \
          "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullrequests?searchCriteria.sourceRefName=refs/heads/$BRANCH_NAME&searchCriteria.status=active&api-version=7.0")
        
        PR_ID=$(echo "$PR_RESPONSE" | jq -r '.value[0].pullRequestId // empty')
        
        if [ -n "$PR_ID" ] && [ "$PR_ID" != "null" ]; then
          echo "Found PR ID: $PR_ID"
          echo "##vso[task.setvariable variable=PR_ID]$PR_ID"
        else
          echo "No open PR found for branch $BRANCH_NAME"
          echo "##vso[task.setvariable variable=PR_ID]"
        fi
      fi
    displayName: 'Detect PR ID'

  # Run the AI code review
  - script: |
      echo "Running AI-powered code review..."
      echo "PR ID: $(PR_ID)"
      
      if [ -z "$(PR_ID)" ]; then
        echo "No PR ID available - skipping review"
        exit 0
      fi
      
      node dist/index.js review \
        --platform azdo \
        --org-url "$(System.CollectionUri)" \
        --azdo-pat "$(System.AccessToken)" \
        --project "$(System.TeamProject)" \
        --repository "$(Build.Repository.Name)" \
        --pr-id "$(PR_ID)" \
        --use-api \
        --post-comment \
        --output "$(Build.ArtifactStagingDirectory)/review-report.md"
      
      REVIEW_EXIT_CODE=$?
      
      echo "Review completed with exit code: $REVIEW_EXIT_CODE"
      
      # Don't fail the build for warnings, only for errors
      if [ $REVIEW_EXIT_CODE -eq 1 ]; then
        echo "##vso[task.logissue type=error]Code review found critical issues"
        exit 1
      fi
      
      exit 0
    displayName: 'Run AI Code Review'
    condition: succeeded()
    env:
      COPILOT_TOKEN: $(COPILOT_TOKEN)
      GH_TOKEN: $(COPILOT_TOKEN)
      REVIEW_CONFIG_PATH: '$(Build.SourcesDirectory)/review-config.json'

  # Publish the review report as a build artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/review-report.md'
      ArtifactName: 'code-review-report'
      publishLocation: 'Container'
    displayName: 'Publish Review Report'
    condition: and(succeeded(), ne(variables['PR_ID'], ''))
